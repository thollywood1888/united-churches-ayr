<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1b2d">
<title>Sign in · United Churches of Ayr AFC</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; background: var(--navy); }
  .login-card {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-badge { width: 72px; height: 72px; object-fit: contain; margin-bottom: 16px; }
  .login-card h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; color: var(--navy); }
  .login-card .sub { margin: 0 0 28px; font-size: 13px; color: var(--ink-soft); }
  .login-card form { display: grid; gap: 12px; text-align: left; }
  .login-card button { width: 100%; justify-self: stretch; padding: 11px; font-size: 15px; }
  .error-msg { background: #fdecea; border: 1px solid #f5c6c2; border-radius: 8px; color: #b0243a; font-size: 13px; padding: 10px 14px; text-align: left; }
</style>
</head>
<body>
<div class="login-card">
  <img src="/static/badges/uca.png" class="login-badge" alt="UCA">
  <h1>United Churches of Ayr AFC</h1>
  <p class="sub">Sign in to the club app</p>

  {% if error %}
  <p class="error-msg">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login">
    <label class="field">Username<input name="username" autocomplete="username" autocapitalize="off" required></label>
    <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
