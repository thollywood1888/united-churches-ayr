<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>{% block title %}{{ club_name }}{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v=mobile-fixes">
</head>
<body>
<header class="masthead">
  <div style="max-width:var(--shell);margin-inline:auto;display:flex;align-items:center;gap:14px;width:100%">
    <img src="/static/badges/uca.png" class="crest-img" alt="United Churches of Ayr AFC">
    <div class="identity">
      <h1>{{ club_name }}</h1>
      <p class="sub">{{ season.division }} · {{ season.label }}</p>
    </div>
    <form method="post" action="/logout" style="margin-left:auto;flex:none">
      <button type="submit" style="background:transparent;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.7);font-size:13px;padding:6px 14px;border-radius:6px;cursor:pointer">Log out</button>
    </form>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <a href="/" class="tab {{ 'is-current' if tab == 'overview' }}">Overview</a>
  <a href="/fixtures" class="tab {{ 'is-current' if tab == 'fixtures' }}">Fixtures &amp; results</a>
  <a href="/squad" class="tab {{ 'is-current' if tab == 'squad' }}">Squad &amp; stats</a>
  <a href="/lineups" class="tab {{ 'is-current' if tab == 'lineups' }}">Lineups</a>
  <a href="/fines" class="tab {{ 'is-current' if tab == 'fines' }}">Fines</a>
  <a href="/fees" class="tab {{ 'is-current' if tab == 'fees' }}">Monthly fees</a>
  <a href="/table" class="tab {{ 'is-current' if tab == 'table' }}">League table</a>
  <a href="/links" class="tab {{ 'is-current' if tab == 'links' }}">Links</a>
</nav>

<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>

<footer class="foot">Be strong and courageous · {{ season.label }}</footer>

{% if not is_gaffer %}
<script>
(function () {
  var INTERVAL = 60000;
  var timer = null;
  function scheduleRefresh() {
    clearTimeout(timer);
    timer = setTimeout(function () { location.reload(); }, INTERVAL);
  }
  scheduleRefresh();
  ['click','keydown','touchstart','scroll'].forEach(function (e) {
    document.addEventListener(e, scheduleRefresh, { passive: true });
  });
})();
</script>
{% endif %}
</body>
</html>
